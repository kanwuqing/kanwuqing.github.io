<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX 语法速查与示例表</title>

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>
        :root {
            --bg: #f5f3f0;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-secondary: #5a6c7d;
            --border: #e2dcd5;
            --accent: #4a7c96;
            --accent-light: #e8f0f5;
            --highlight: #fff8e1;
            --highlight-border: #f0c040;
            --code-bg: #1e2a32;
            --code-text: #d4dbe4;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 6px 20px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
            --font-sans: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            --btn-bg: #ffffff;
            --btn-border: #e2dcd5;
            --btn-hover: #f0e9de;
        }

        /* 暗色模式变量 */
        body[data-theme="dark"] {
            --bg: #1a1d23;
            --card-bg: #24272e;
            --text: #e0e3e8;
            --text-secondary: #a0a6b0;
            --border: #3a3f4a;
            --accent: #6ea8c9;
            --accent-light: #2c3d4f;
            --highlight: #3a3820;
            --highlight-border: #f0c040;
            --code-bg: #15171c;
            --code-text: #ccd6e0;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-hover: 0 6px 20px rgba(0,0,0,0.4);
            --btn-bg: #2a2d35;
            --btn-border: #4a4f5a;
            --btn-hover: #3a3e47;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; scroll-padding-top: 140px; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background 0.3s, color 0.3s;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            transition: background 0.3s, border-color 0.3s;
        }
        .header-inner {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .header-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-title .icon { font-size: 1.5rem; }
        .header-badge {
            font-size: 0.7rem;
            background: var(--accent-light);
            color: var(--accent);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: background 0.3s, color 0.3s;
        }

        /* 暗色模式按钮 */
        .theme-toggle {
            background: var(--btn-bg);
            border: 2px solid var(--btn-border);
            border-radius: 50px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
            transition: all 0.3s;
            white-space: nowrap;
            font-weight: 500;
        }
        .theme-toggle:hover {
            background: var(--btn-hover);
            border-color: var(--accent);
        }

        .search-wrapper { flex: 1; min-width: 220px; max-width: 500px; position: relative; }
        .search-input {
            width: 100%;
            padding: 11px 44px 11px 18px;
            font-size: 0.95rem;
            border: 2px solid var(--border);
            border-radius: 30px;
            background: var(--card-bg);
            color: var(--text);
            font-family: var(--font-sans);
            transition: var(--transition);
            outline: none;
            letter-spacing: 0.2px;
        }
        .search-input:focus {
            border-color: var(--accent);
            background: var(--card-bg);
            box-shadow: 0 0 0 5px rgba(74, 124, 150, 0.08);
        }
        .search-input::placeholder { color: #b0a99e; font-style: italic; }
        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: #b0a99e;
            pointer-events: none;
            transition: var(--transition);
        }
        .search-input:focus~.search-icon { color: var(--accent); }
        .search-clear {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            color: #b0a99e;
            padding: 4px 8px;
            border-radius: 50%;
            transition: var(--transition);
            display: none;
            line-height: 1;
        }
        .search-clear.visible { display: block; }
        .search-clear:hover { color: #e07060; background: rgba(0,0,0,0.04); }
        .search-info {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            min-width: 80px;
            text-align: center;
            font-weight: 500;
        }
        .search-info .count { font-weight: 700; color: var(--accent); font-size: 1rem; }

        .main { max-width: 1300px; margin: 0 auto; padding: 28px 24px 60px; }

        .category-section { margin-bottom: 36px; scroll-margin-top: 140px; }
        .category-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.2px;
            transition: color 0.3s, border-color 0.3s;
        }
        .category-title.hidden-category { display: none; }
        .category-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 14px;
        }

        .card {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            display: flex;
            align-items: stretch;
            gap: 16px;
            transition: var(--transition);
            box-shadow: var(--shadow);
            position: relative;
            scroll-margin-top: 150px;
            cursor: default;
            min-height: 60px;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
            border-color: #d0c8bb;
            transform: translateY(-1px);
        }
        .card.highlight-match {
            border-color: var(--highlight-border) !important;
            background: var(--highlight) !important;
            box-shadow: 0 0 0 6px rgba(240, 192, 64, 0.13) !important;
            animation: pulseHighlight 1.8s ease-in-out infinite;
            z-index: 2;
        }
        @keyframes pulseHighlight {
            0%,100%{ box-shadow: 0 0 0 6px rgba(240,192,64,0.13); }
            50%{ box-shadow: 0 0 0 14px rgba(240,192,64,0.04); }
        }
        .card.card-dimmed { opacity: 0.28; pointer-events: none; filter: grayscale(30%); transition: var(--transition); }
        .card.card-hidden { display: none; }

        .card-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
        .card-name { font-weight: 600; font-size: 0.9rem; color: var(--text); display: flex; align-items: center; gap: 6px; }
        .card-name-en { font-size: 0.72rem; color: var(--text-secondary); font-weight: 400; font-style: italic; }
        .card-code-wrap {
            background: var(--code-bg);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            position: relative;
            overflow-x: auto;
            white-space: nowrap;
            cursor: pointer;
            user-select: all;
            -webkit-user-select: all;
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .card-code-wrap:hover { border-color: #5a7a90; }
        .card-code-wrap code {
            font-family: var(--font-mono);
            font-size: 0.88rem;
            color: #e8ecf1;
            letter-spacing: 0.3px;
            line-height: 1.5;
            white-space: pre;
        }
        .copy-hint {
            position: absolute;
            top: 6px;
            right: 10px;
            font-size: 0.6rem;
            color: #8899a6;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .card-code-wrap:hover .copy-hint { opacity: 1; }

        .copy-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #2c3e50;
            color: #fff;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 999;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .card-right {
            flex: 0 0 auto;
            min-width: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            padding: 0 6px;
        }
        .card-right .katex-display { margin: 0 !important; }
        .card-right .katex { font-size: 1.2rem; }
        .render-display { display: flex; align-items: center; justify-content: center; min-height: 36px; }

        .no-results { text-align: center; padding: 50px 20px; color: var(--text-secondary); display: none; }
        .no-results.visible { display: block; }
        .no-results .emoji { font-size: 3rem; display: block; margin-bottom: 12px; }

        .scroll-top-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 2px solid var(--border);
            cursor: pointer;
            font-size: 1.3rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
        }
        .scroll-top-btn.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .scroll-top-btn:hover { border-color: var(--accent); box-shadow: var(--shadow-hover); transform: translateY(-3px); }

        @media (max-width: 768px) {
            .header { padding: 12px 14px; }
            .header-inner { gap: 10px; }
            .header-title { font-size: 1.1rem; }
            .search-wrapper { min-width: 150px; flex: 2; }
            .search-input { padding: 10px 38px 10px 14px; font-size: 0.85rem; }
            .search-info { font-size: 0.7rem; min-width: auto; }
            .main { padding: 16px 10px 40px; }
            .category-cards { grid-template-columns: 1fr; gap: 10px; }
            .card { flex-direction: column; padding: 14px 16px; gap: 12px; scroll-margin-top: 130px; }
            .card-right { justify-content: flex-start; min-width: auto; padding: 0; }
            .card-right .katex { font-size: 1.15rem; }
            html { scroll-padding-top: 120px; }
            .category-section { scroll-margin-top: 120px; }
            .scroll-top-btn { bottom: 20px; right: 16px; width: 38px; height: 38px; font-size: 1.1rem; }
        }
        @media (max-width: 480px) {
            .header-inner { gap: 6px; }
            .header-title { font-size: 1rem; }
            .header-badge { font-size: 0.6rem; padding: 2px 7px; }
            .search-input { font-size: 0.8rem; padding: 9px 34px 9px 12px; }
            .search-info { font-size: 0.65rem; }
            .card { padding: 10px 12px; gap: 8px; }
            .card-code-wrap code { font-size: 0.78rem; }
        }
    </style>
</head>
<body>
    <!-- ==================== Header ==================== -->
    <header class="header">
        <div class="header-inner">
            <div class="header-title">
                <span class="icon">📐</span> LaTeX 速查表
                <span class="header-badge">Cheat Sheet</span>
            </div>
            <div class="search-wrapper">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索中文/英文关键词，如：向量、vector、阿尔法、全等…" autocomplete="off">
                <button class="search-clear" id="searchClear" title="清空搜索">✕</button>
                <span class="search-icon">🔍</span>
            </div>
            <span class="search-info" id="searchInfo">共 <span class="count" id="totalCount">0</span> 条</span>
            <button class="theme-toggle" id="themeToggle" title="切换暗色模式">
                <span class="theme-icon">🌙</span> <span class="theme-text">暗色</span>
            </button>
        </div>
    </header>

    <!-- ==================== Main ==================== -->
    <main class="main" id="mainContainer">
        <!-- 动态生成 -->
    </main>

    <!-- No Results -->
    <div class="no-results" id="noResults">
        <span class="emoji">😕</span>
        <span>未找到匹配的 LaTeX 条目，试试其他关键词</span>
    </div>

    <!-- Copy Toast -->
    <div class="copy-toast" id="copyToast">✅ 已复制到剪贴板</div>

    <!-- Scroll to Top -->
    <button class="scroll-top-btn" id="scrollTopBtn" title="回到顶部">⬆</button>

    <!-- KaTeX JS -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <script>
        (function() {
            // ==================== 数据定义 ====================
            const categories = [
                { id: 'greek', emoji: '🔤', name: '希腊字母', nameEn: 'Greek Letters' },
                { id: 'operators', emoji: '➕', name: '数学运算符', nameEn: 'Operators' },
                { id: 'relations', emoji: '🔗', name: '关系符号', nameEn: 'Relations' },
                { id: 'logic', emoji: '🧠', name: '逻辑与集合', nameEn: 'Logic & Set Theory' },
                { id: 'arrows', emoji: '➡️', name: '箭头符号', nameEn: 'Arrows' },
                { id: 'brackets', emoji: '🅱️', name: '括号与分隔符', nameEn: 'Brackets & Delimiters' },
                { id: 'vectors', emoji: '📐', name: '向量', nameEn: 'Vectors' },
                { id: 'matrices', emoji: '🔲', name: '矩阵', nameEn: 'Matrices' },
                { id: 'frac-roots', emoji: '📊', name: '分数、根号与二项式', nameEn: 'Fractions, Roots & Binomials' },
                { id: 'int-sum', emoji: '∫', name: '积分与求和', nameEn: 'Integrals & Sums' },
                { id: 'limits', emoji: '📈', name: '极限与导数', nameEn: 'Limits & Derivatives' },
                { id: 'fonts', emoji: '🎨', name: '字体与样式', nameEn: 'Fonts & Styles' },
                { id: 'accents', emoji: '◌̂', name: '重音符号', nameEn: 'Accents' },
                { id: 'functions', emoji: '𝑓', name: '常用函数', nameEn: 'Common Functions' },
                { id: 'subsup', emoji: 'ˣ', name: '上下标', nameEn: 'Sub & Superscripts' },
                { id: 'shapes', emoji: '🔷', name: '几何与图形', nameEn: 'Shapes & Suits' },
                { id: 'misc', emoji: '📝', name: '其他常用', nameEn: 'Miscellaneous' }
            ];

            const entries = [
                // ===== 希腊字母 (含音译) =====
                { id:'alpha', cat:'greek', name:'阿尔法', nameEn:'Alpha', keywords:['alpha','阿尔法','α','希腊字母'], code:'\\alpha', display:'\\alpha' },
                { id:'beta', cat:'greek', name:'贝塔', nameEn:'Beta', keywords:['beta','贝塔','β','希腊字母'], code:'\\beta', display:'\\beta' },
                { id:'gamma', cat:'greek', name:'伽马', nameEn:'Gamma', keywords:['gamma','伽马','γ','希腊字母'], code:'\\gamma', display:'\\gamma' },
                { id:'delta', cat:'greek', name:'德尔塔', nameEn:'Delta', keywords:['delta','德尔塔','δ','希腊字母'], code:'\\delta', display:'\\delta' },
                { id:'epsilon', cat:'greek', name:'艾普西隆', nameEn:'Epsilon', keywords:['epsilon','艾普西隆','ε','希腊字母'], code:'\\epsilon', display:'\\epsilon' },
                { id:'varepsilon', cat:'greek', name:'艾普西隆(变体)', nameEn:'Varepsilon', keywords:['varepsilon','变体','ε','希腊字母'], code:'\\varepsilon', display:'\\varepsilon' },
                { id:'zeta', cat:'greek', name:'泽塔', nameEn:'Zeta', keywords:['zeta','泽塔','ζ','希腊字母'], code:'\\zeta', display:'\\zeta' },
                { id:'eta', cat:'greek', name:'艾塔', nameEn:'Eta', keywords:['eta','艾塔','η','希腊字母'], code:'\\eta', display:'\\eta' },
                { id:'theta', cat:'greek', name:'西塔', nameEn:'Theta', keywords:['theta','西塔','θ','希腊字母'], code:'\\theta', display:'\\theta' },
                { id:'vartheta', cat:'greek', name:'西塔(变体)', nameEn:'Vartheta', keywords:['vartheta','变体','ϑ','θ','希腊字母'], code:'\\vartheta', display:'\\vartheta' },
                { id:'iota', cat:'greek', name:'约塔', nameEn:'Iota', keywords:['iota','约塔','ι','希腊字母'], code:'\\iota', display:'\\iota' },
                { id:'kappa', cat:'greek', name:'卡帕', nameEn:'Kappa', keywords:['kappa','卡帕','κ','希腊字母'], code:'\\kappa', display:'\\kappa' },
                { id:'varkappa', cat:'greek', name:'卡帕(变体)', nameEn:'Varkappa', keywords:['varkappa','变体','ϰ','κ','希腊字母'], code:'\\varkappa', display:'\\varkappa' },
                { id:'lambda', cat:'greek', name:'拉姆达', nameEn:'Lambda', keywords:['lambda','拉姆达','λ','希腊字母'], code:'\\lambda', display:'\\lambda' },
                { id:'mu', cat:'greek', name:'缪', nameEn:'Mu', keywords:['mu','缪','μ','希腊字母'], code:'\\mu', display:'\\mu' },
                { id:'nu', cat:'greek', name:'纽', nameEn:'Nu', keywords:['nu','纽','ν','希腊字母'], code:'\\nu', display:'\\nu' },
                { id:'xi', cat:'greek', name:'克西', nameEn:'Xi', keywords:['xi','克西','ξ','希腊字母'], code:'\\xi', display:'\\xi' },
                { id:'omicron', cat:'greek', name:'奥密克戎', nameEn:'Omicron', keywords:['omicron','奥密克戎','ο','希腊字母'], code:'\\omicron', display:'\\omicron' },
                { id:'pi', cat:'greek', name:'派', nameEn:'Pi', keywords:['pi','派','π','圆周率','希腊字母'], code:'\\pi', display:'\\pi' },
                { id:'varpi', cat:'greek', name:'派(变体)', nameEn:'Varpi', keywords:['varpi','变体','ϖ','π','希腊字母'], code:'\\varpi', display:'\\varpi' },
                { id:'rho', cat:'greek', name:'柔', nameEn:'Rho', keywords:['rho','柔','ρ','希腊字母'], code:'\\rho', display:'\\rho' },
                { id:'varrho', cat:'greek', name:'柔(变体)', nameEn:'Varrho', keywords:['varrho','变体','ϱ','ρ','希腊字母'], code:'\\varrho', display:'\\varrho' },
                { id:'sigma', cat:'greek', name:'西格玛', nameEn:'Sigma', keywords:['sigma','西格玛','σ','希腊字母'], code:'\\sigma', display:'\\sigma' },
                { id:'varsigma', cat:'greek', name:'西格玛(变体)', nameEn:'Varsigma', keywords:['varsigma','变体','ς','σ','希腊字母'], code:'\\varsigma', display:'\\varsigma' },
                { id:'tau', cat:'greek', name:'陶', nameEn:'Tau', keywords:['tau','陶','τ','希腊字母'], code:'\\tau', display:'\\tau' },
                { id:'upsilon', cat:'greek', name:'宇普西龙', nameEn:'Upsilon', keywords:['upsilon','宇普西龙','υ','希腊字母'], code:'\\upsilon', display:'\\upsilon' },
                { id:'phi', cat:'greek', name:'斐', nameEn:'Phi', keywords:['phi','斐','φ','希腊字母'], code:'\\phi', display:'\\phi' },
                { id:'varphi', cat:'greek', name:'斐(变体)', nameEn:'Varphi', keywords:['varphi','变体','φ','ϕ','希腊字母'], code:'\\varphi', display:'\\varphi' },
                { id:'chi', cat:'greek', name:'希', nameEn:'Chi', keywords:['chi','希','χ','希腊字母'], code:'\\chi', display:'\\chi' },
                { id:'psi', cat:'greek', name:'普西', nameEn:'Psi', keywords:['psi','普西','ψ','希腊字母'], code:'\\psi', display:'\\psi' },
                { id:'omega', cat:'greek', name:'欧米伽', nameEn:'Omega', keywords:['omega','欧米伽','ω','希腊字母'], code:'\\omega', display:'\\omega' },
                { id:'digamma', cat:'greek', name:'迪伽马', nameEn:'Digamma', keywords:['digamma','ϝ','希腊字母'], code:'\\digamma', display:'\\digamma' },
                { id:'Gamma-upper', cat:'greek', name:'大写 伽马', nameEn:'Gamma uppercase', keywords:['Gamma','大写','Γ','uppercase','希腊字母'], code:'\\Gamma', display:'\\Gamma' },
                { id:'Delta-upper', cat:'greek', name:'大写 德尔塔', nameEn:'Delta uppercase', keywords:['Delta','大写','Δ','uppercase','希腊字母'], code:'\\Delta', display:'\\Delta' },

                { id:'diamondsuit', cat:'shapes', name:'方块', nameEn:'Diamond suit', keywords:['diamondsuit','方块','♢','扑克','形状'], code:'\\diamondsuit', display:'\\diamondsuit' },

                { id:'measuredangle', cat:'shapes', name:'测量角', nameEn:'Measured angle', keywords:['measuredangle','测量角','∡','形状'], code:'\\measuredangle', display:'\\measuredangle' },
                { id:'sphericalangle', cat:'shapes', name:'球面角', nameEn:'Spherical angle', keywords:['sphericalangle','球面角','∢','形状'], code:'\\sphericalangle', display:'\\sphericalangle' },

                // ===== 其他常用 =====
                { id:'quad', cat:'misc', name:'空格', nameEn:'Quad space', keywords:['quad','空格','间距','space'], code:'\\quad', display:'\\quad' },
                { id: 'hspace{em}', cat:'misc', name:'空格(多个)', nameEn:'Hspace', keywords:['hspace','空格','间距','space'], code:'\\hspace{xem}', display:'\\hspace{em}' },
                { id:'ldots', cat:'misc', name:'省略号（底线）', nameEn:'Ellipsis (baseline)', keywords:['ldots','省略号','...','点'], code:'\\ldots', display:'\\ldots' },
                { id:'cdots', cat:'misc', name:'省略号（居中）', nameEn:'Ellipsis (centered)', keywords:['cdots','省略号','⋯','点'], code:'\\cdots', display:'\\cdots' },

                { id:'ddots', cat:'misc', name:'省略号（对角）', nameEn:'Ellipsis (diagonal)', keywords:['ddots','省略号','⋱','点','对角'], code:'\\ddots', display:'\\ddots' },
                { id:'boxed', cat:'misc', name:'加框', nameEn:'Boxed', keywords:['boxed','框','盒子','方框'], code:'\\boxed{E=mc^2}', display:'\\boxed{E=mc^2}' },
                { id:'cancel', cat:'misc', name:'斜线取消', nameEn:'Cancel', keywords:['cancel','取消','斜线','修饰'], code:'\\cancel{5}', display:'\\cancel{5}' },
                { id:'bcancel', cat:'misc', name:'反斜线取消', nameEn:'Bcancel', keywords:['bcancel','取消','反斜线'], code:'\\bcancel{5}', display:'\\bcancel{5}' },
                { id:'xcancel', cat:'misc', name:'叉号取消', nameEn:'Xcancel', keywords:['xcancel','取消','叉号'], code:'\\xcancel{ABC}', display:'\\xcancel{ABC}' },
                { id:'overbrace', cat:'misc', name:'上括号', nameEn:'Overbrace', keywords:['overbrace','上括号','修饰','注释'], code:'\\overbrace{a+b+c}^{\\text{note}}', display:'\\overbrace{a+b+c}^{\\text{note}}' },
                { id:'underbrace', cat:'misc', name:'下括号', nameEn:'Underbrace', keywords:['underbrace','下括号','修饰','注释'], code:'\\underbrace{a+b+c}_{\\text{note}}', display:'\\underbrace{a+b+c}_{\\text{note}}' },
                { id:'stackrel', cat:'misc', name:'堆叠符号', nameEn:'Stack relation', keywords:['stackrel','堆叠','上下','等于','def'], code:'a \\stackrel{\\text{def}}{=} b', display:'a \\stackrel{\\text{def}}{=} b' },
                { id:'displaystyle', cat:'misc', name:'块级样式', nameEn:'Display style', keywords:['displaystyle','块级','display','样式','大号'], code:'\\displaystyle\\sum_{i=1}^{n}', display:'\\displaystyle\\sum_{i=1}^{n}' },
                { id:'text-degree', cat:'misc', name:'角度/度数', nameEn:'Degree', keywords:['degree','角度','度数','°','circ'], code:'90^{\\circ}', display:'90^{\\circ}' },
                { id:'hbar', cat:'misc', name:'约化普朗克常数', nameEn:'h-bar', keywords:['hbar','ħ','普朗克','常数'], code:'\\hbar', display:'\\hbar' },
                { id:'ell', cat:'misc', name:'手写体l', nameEn:'ell', keywords:['ell','ℓ','手写体'], code:'\\ell', display:'\\ell' },
                { id:'wp', cat:'misc', name:'魏尔斯特拉斯p', nameEn:'Weierstrass p', keywords:['wp','℘','魏尔斯特拉斯'], code:'\\wp', display:'\\wp' },
                { id:'Re', cat:'misc', name:'实部', nameEn:'Real part', keywords:['Re','实部','ℜ','复数'], code:'\\Re', display:'\\Re' },
                { id:'Im', cat:'misc', name:'虚部', nameEn:'Imaginary part', keywords:['Im','虚部','ℑ','复数'], code:'\\Im', display:'\\Im' },
                { id:'aleph', cat:'misc', name:'阿列夫', nameEn:'Aleph', keywords:['aleph','ℵ','集合','基数'], code:'\\aleph', display:'\\aleph' },
            ];

            // ==================== DOM 引用 ====================
            const mainContainer = document.getElementById('mainContainer');
            const noResults = document.getElementById('noResults');
            const searchInput = document.getElementById('searchInput');
            const searchClear = document.getElementById('searchClear');
            const searchInfo = document.getElementById('searchInfo');
            const totalCountEl = document.getElementById('totalCount');
            const copyToast = document.getElementById('copyToast');
            const scrollTopBtn = document.getElementById('scrollTopBtn');
            const themeToggle = document.getElementById('themeToggle');

            let allCardEls = [];
            let categorySectionEls = {};
            let currentMatchIds = new Set();
            let toastTimer = null;

            // ==================== 暗色模式 ====================
            function applyTheme(dark) {
                document.body.setAttribute('data-theme', dark ? 'dark' : '');
                const icon = themeToggle.querySelector('.theme-icon');
                const text = themeToggle.querySelector('.theme-text');
                if (dark) {
                    icon.textContent = '☀️';
                    text.textContent = '亮色';
                } else {
                    icon.textContent = '🌙';
                    text.textContent = '暗色';
                }
            }

            function initTheme() {
                const stored = localStorage.getItem('latex-cheat-theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const dark = stored ? stored === 'dark' : prefersDark;
                applyTheme(dark);
            }

            themeToggle.addEventListener('click', () => {
                const isDark = document.body.hasAttribute('data-theme') && document.body.getAttribute('data-theme') === 'dark';
                const newDark = !isDark;
                applyTheme(newDark);
                localStorage.setItem('latex-cheat-theme', newDark ? 'dark' : 'light');
            });

            // ==================== 构建页面 ====================
            function buildPage() {
                mainContainer.innerHTML = '';
                allCardEls = [];
                categorySectionEls = {};

                categories.forEach(cat => {
                    const catEntries = entries.filter(e => e.cat === cat.id);
                    if (catEntries.length === 0) return;

                    const section = document.createElement('section');
                    section.className = 'category-section';
                    section.id = 'cat-' + cat.id;
                    section.setAttribute('data-cat', cat.id);

                    const title = document.createElement('h2');
                    title.className = 'category-title';
                    title.innerHTML = `<span class="cat-emoji">${cat.emoji}</span> ${cat.name} <span style="font-weight:400;font-size:0.8rem;color:var(--text-secondary);">${cat.nameEn}</span>`;
                    section.appendChild(title);

                    const cardsGrid = document.createElement('div');
                    cardsGrid.className = 'category-cards';

                    catEntries.forEach(entry => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.id = 'entry-' + entry.id;
                        card.setAttribute('data-entry-id', entry.id);
                        card.setAttribute('data-cat', entry.cat);

                        const left = document.createElement('div');
                        left.className = 'card-left';

                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'card-name';
                        nameDiv.textContent = entry.name;
                        const nameEnSpan = document.createElement('span');
                        nameEnSpan.className = 'card-name-en';
                        nameEnSpan.textContent = entry.nameEn;
                        nameDiv.appendChild(nameEnSpan);

                        const codeWrap = document.createElement('div');
                        codeWrap.className = 'card-code-wrap';
                        const codeEl = document.createElement('code');
                        codeEl.textContent = entry.code;
                        codeWrap.appendChild(codeEl);
                        const copyHint = document.createElement('span');
                        copyHint.className = 'copy-hint';
                        copyHint.textContent = '点击复制';
                        codeWrap.appendChild(copyHint);

                        codeWrap.addEventListener('click', (e) => {
                            e.stopPropagation();
                            copyToClipboard(entry.code);
                        });

                        left.appendChild(nameDiv);
                        left.appendChild(codeWrap);

                        const right = document.createElement('div');
                        right.className = 'card-right';
                        const renderDiv = document.createElement('div');
                        renderDiv.className = 'render-display';
                        const displayCode = entry.display || entry.code;
                        const isBlock = displayCode.includes('\\begin{') || displayCode.includes('\\displaystyle');
                        renderDiv.textContent = (isBlock ? '$$' : '$') + displayCode + (isBlock ? '$$' : '$');
                        right.appendChild(renderDiv);

                        card.appendChild(left);
                        card.appendChild(right);
                        cardsGrid.appendChild(card);

                        allCardEls.push({
                            el: card,
                            entry: entry,
                            sectionEl: section,
                            catId: entry.cat,
                        });
                    });

                    section.appendChild(cardsGrid);
                    mainContainer.appendChild(section);
                    categorySectionEls[cat.id] = section;
                });

                // 渲染 KaTeX
                renderMathInElement(mainContainer, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                    ],
                    throwOnError: false,
                    strict: false,
                    trust: true,
                });

                totalCountEl.textContent = entries.length;
                searchInfo.innerHTML = '共 <span class="count">' + entries.length + '</span> 条';
            }

            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => showToast());
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.left = '-9999px';
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); showToast(); } catch(e) {}
                    document.body.removeChild(ta);
                }
            }

            function showToast() {
                if (toastTimer) clearTimeout(toastTimer);
                copyToast.classList.add('show');
                toastTimer = setTimeout(() => {
                    copyToast.classList.remove('show');
                }, 1800);
            }

            function doSearch(query) {
                const q = query.trim().toLowerCase();
                currentMatchIds.clear();

                if (q === '') {
                    allCardEls.forEach(item => {
                        item.el.classList.remove('highlight-match', 'card-dimmed', 'card-hidden');
                    });
                    Object.values(categorySectionEls).forEach(sec => {
                        const title = sec.querySelector('.category-title');
                        if (title) title.classList.remove('hidden-category');
                    });
                    noResults.classList.remove('visible');
                    searchClear.classList.remove('visible');
                    searchInfo.innerHTML = '共 <span class="count">' + entries.length + '</span> 条';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }

                searchClear.classList.add('visible');
                let matchCount = 0;
                const matchedCatIds = new Set();

                allCardEls.forEach(item => {
                    const e = item.entry;
                    const searchText = (e.name + '|' + e.nameEn + '|' + e.keywords.join('|')).toLowerCase();
                    if (searchText.includes(q)) {
                        item.el.classList.remove('card-dimmed', 'card-hidden');
                        item.el.classList.add('highlight-match');
                        currentMatchIds.add(e.id);
                        matchedCatIds.add(item.catId);
                        matchCount++;
                    } else {
                        item.el.classList.remove('highlight-match');
                        item.el.classList.add('card-dimmed');
                    }
                });

                Object.entries(categorySectionEls).forEach(([catId, sec]) => {
                    const title = sec.querySelector('.category-title');
                    if (title) title.classList.toggle('hidden-category', !matchedCatIds.has(catId));
                });

                searchInfo.innerHTML = '匹配 <span class="count">' + matchCount + '</span> 条';

                if (matchCount === 0) {
                    noResults.classList.add('visible');
                } else {
                    noResults.classList.remove('visible');
                    const firstMatch = allCardEls.find(item => currentMatchIds.has(item.entry.id));
                    if (firstMatch) {
                        firstMatch.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }

            searchInput.addEventListener('input', function() {
                clearTimeout(this._timer);
                this._timer = setTimeout(() => doSearch(this.value), 250);
            });

            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    this.value = '';
                    doSearch('');
                    this.blur();
                }
            });

            searchClear.addEventListener('click', function() {
                searchInput.value = '';
                doSearch('');
                searchInput.focus();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === '/' && document.activeElement !== searchInput && document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    searchInput.focus();
                }
            });

            function updateScrollTopBtn() {
                if (window.scrollY > 500) {
                    scrollTopBtn.classList.add('visible');
                } else {
                    scrollTopBtn.classList.remove('visible');
                }
            }

            window.addEventListener('scroll', updateScrollTopBtn, { passive: true });
            scrollTopBtn.addEventListener('click', function() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ==================== 初始化 ====================
            initTheme();
            buildPage();
            updateScrollTopBtn();
        })();
    </script>
</body>
</html>
