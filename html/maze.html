    <script>
        class Maze {
            constructor(rows = 15, cols = 15) {
                this.rows = rows;
                this.cols = cols;
                this.grid = [];
                this.start = {x: 0, y: 0};
                this.end = {x: cols-1, y: rows-1};
                this.generateMaze();
                this.ensurePathExists();
            }

            generateMaze() {
                const stack = [];
                this.grid = Array(this.rows).fill().map(() => 
                    Array(this.cols).fill().map(() => ({
                        walls: [true, true, true, true],
                        visited: false
                    }))
                );

                let current = {x: 0, y: 0};
                this.grid[current.y][current.x].visited = true;
                stack.push(current);

                while(stack.length > 0) {
                    let neighbors = [];
                    const dirs = [
                        {x: 0, y:-1, wallIdx: 0},
                        {x: 1, y: 0, wallIdx: 1},
                        {x: 0, y: 1, wallIdx: 2},
                        {x:-1, y: 0, wallIdx: 3}
                    ];

                    dirs.forEach(dir => {
                        const nx = current.x + dir.x;
                        const ny = current.y + dir.y;
                        if (nx >=0 && nx < this.cols && ny >=0 && ny < this.rows && 
                            !this.grid[ny][nx].visited) {
                            neighbors.push({x: nx, y: ny, dir});
                        }
                    });

                    if (neighbors.length > 0) {
                        const next = neighbors[Math.floor(Math.random()*neighbors.length)];
                        this.grid[current.y][current.x].walls[next.dir.wallIdx] = false;
                        this.grid[next.y][next.x].walls[(next.dir.wallIdx+2)%4] = false;
                        this.grid[next.y][next.x].visited = true;
                        stack.push(current);
                        current = next;
                    } else {
                        current = stack.pop();
                    }
                }

                for(let y = 0; y < this.rows; y++) {
                    for(let x = 0; x < this.cols; x++) {
                        const rotations = Math.floor(Math.random() * 4);
                        for(let i = 0; i < rotations; i++) {
                            this.rotateCell(x, y, 1);
                        }
                    }
                }
            }

            ensurePathExists() {
                let retry = 0;
                while(!this.findPath() && retry < 10) {
                    this.generateMaze();
                    retry++;
                }
                if(retry === 10) {
                    console.error("无法生成有效路径");
                }
            }

            rotateCell(x, y, direction) {
                if(x < 0 || x >= this.cols || y < 0 || y >= this.rows) return;

                const cell = this.grid[y][x];
                const newWalls = [];
                for(let i = 0; i < 4; i++) {
                    newWalls[i] = cell.walls[(i - direction + 4) % 4];
                }
                cell.walls = newWalls;

                const dirs = [
                    {dx: 0, dy: -1, opposite: 2},
                    {dx: 1, dy: 0, opposite: 3},
                    {dx: 0, dy: 1, opposite: 0},
                    {dx: -1, dy: 0, opposite: 1}
                ];

                for(let i = 0; i < 4; i++) {
                    const nx = x + dirs[i].dx;
                    const ny = y + dirs[i].dy;
                    if(nx >=0 && nx < this.cols && ny >=0 && ny < this.rows) {
                        const neighbor = this.grid[ny][nx];
                        neighbor.walls[dirs[i].opposite] = newWalls[i];
                    }
                }
            }

            async findPath(visualCallback) {
                const startNode = {x: this.start.x, y: this.start.y, g:0, h:0, f:0, parent:null};
                const endNode = {x: this.end.x, y: this.end.y};
                const openSet = [startNode];
                const closedSet = new Set();
                let current;

                while(openSet.length > 0) {
                    current = openSet.reduce((a,b) => a.f < b.f ? a : b);
                    
                    if(current.x === endNode.x && current.y === endNode.y) {
                        return this.reconstructPath(current);
                    }

                    openSet.splice(openSet.indexOf(current), 1);
                    closedSet.add(`${current.x},${current.y}`);

                    if(visualCallback) {
                        await visualCallback({
                            open: openSet.map(n => ({x:n.x, y:n.y})),
                            closed: Array.from(closedSet).map(s => {
                                const [x,y] = s.split(','); 
                                return {x:parseInt(x), y:parseInt(y)}
                            }),
                            current: {x: current.x, y: current.y}
                        });
                    }

                    const neighbors = this.getNeighbors(current);
                    for(const neighbor of neighbors) {
                        if(!closedSet.has(`${neighbor.x},${neighbor.y}`)) {
                            const gScore = current.g + 1;
                            const existing = openSet.find(n => n.x === neighbor.x && n.y === neighbor.y);
                            
                            if(!existing || gScore < existing.g) {
                                const hScore = Math.abs(neighbor.x - endNode.x) + 
                                            Math.abs(neighbor.y - endNode.y);
                                const newNode = {
                                    x: neighbor.x,
                                    y: neighbor.y,
                                    g: gScore,
                                    h: hScore,
                                    f: gScore + hScore,
                                    parent: current
                                };

                                if(!existing) {
                                    openSet.push(newNode);
                                } else {
                                    Object.assign(existing, newNode);
                                }
                            }
                        }
                    }
                }
                return null;
            }

            getNeighbors(node) {
                const neighbors = [];
                const cell = this.grid[node.y]?.[node.x];
                if(!cell) return neighbors;
                
                if(!cell.walls[1]) neighbors.push({x: node.x+1, y: node.y});
                if(!cell.walls[2]) neighbors.push({x: node.x, y: node.y+1});
                if(!cell.walls[3]) neighbors.push({x: node.x-1, y: node.y});
                if(!cell.walls[0]) neighbors.push({x: node.x, y: node.y-1});
                
                return neighbors;
            }

            reconstructPath(node) {
                const path = [];
                while(node) {
                    path.unshift(node);
                    node = node.parent;
                }
                return path;
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('mazeCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.maze = new Maze();
                this.path = [];
                this.cellSize = 40;
                this.ballPos = {...this.maze.start};
                this.isMoving = false;
                this.currentBlock = null;
                this.startTime = null;
                this.timerInterval = null;
                this.visualElements = [];
                this.isVisualizing = false;
                this.lastPathState = null;

                this.isHardMode = false;
                this.moveLimit = 0;
                this.timePenalty = 0;
                this.dynamicObstacleInterval = null;
                this.resize();
                this.initEvent();
                this.animate();
                this.updateLeaderboardDisplay();
                this.updatePath();
            }

            resize() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
                this.cellSize = Math.min(
                    this.canvas.width / this.maze.cols,
                    this.canvas.height / this.maze.rows
                );
                this.draw();
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                for(let y = 0; y < this.maze.rows; y++) {
                    for(let x = 0; x < this.maze.cols; x++) {
                        const cell = this.maze.grid[y][x];
                        const px = x * this.cellSize;
                        const py = y * this.cellSize;
                        
                        this.ctx.strokeStyle = '#95a5a6';
                        this.ctx.lineWidth = 2;
                        
                        if(cell.walls[0]) this.drawLine(px, py, px+this.cellSize, py);
                        if(cell.walls[1]) this.drawLine(px+this.cellSize, py, px+this.cellSize, py+this.cellSize);
                        if(cell.walls[2]) this.drawLine(px, py+this.cellSize, px+this.cellSize, py+this.cellSize);
                        if(cell.walls[3]) this.drawLine(px, py, px, py+this.cellSize);
                    }
                }

                this.visualElements.forEach(el => {
                    this.ctx.fillStyle = el.color;
                    this.ctx.beginPath();
                    this.ctx.arc(
                        (el.x + 0.5) * this.cellSize,
                        (el.y + 0.5) * this.cellSize,
                        this.cellSize * 0.2, 0, Math.PI * 2
                    );
                    this.ctx.fill();
                });

                if (this.currentBlock) {
                    this.ctx.fillStyle = 'rgba(255, 235, 59, 0.3)';
                    this.ctx.fillRect(
                        this.currentBlock.x * this.cellSize,
                        this.currentBlock.y * this.cellSize,
                        this.cellSize,
                        this.cellSize
                    );
                }

                if(this.path && this.path.length > 0) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(
                        (this.path[0].x + 0.5) * this.cellSize,
                        (this.path[0].y + 0.5) * this.cellSize
                    );
                    for(let i = 1; i < this.path.length; i++) {
                        this.ctx.lineTo(
                            (this.path[i].x + 0.5) * this.cellSize,
                            (this.path[i].y + 0.5) * this.cellSize
                        );
                    }
                    this.ctx.strokeStyle = '#e74c3c';
                    this.ctx.lineWidth = 3;
                    this.ctx.setLineDash([5, 5]);
                    this.ctx.stroke();
                    this.ctx.setLineDash([]);
                }

                this.ctx.fillStyle = '#3498db';
                this.ctx.beginPath();
                this.ctx.arc(
                    (this.ballPos.x + 0.5) * this.cellSize,
                    (this.ballPos.y + 0.5) * this.cellSize,
                    this.cellSize * 0.3, 0, Math.PI * 2
                );
                this.ctx.fill();

                this.ctx.fillStyle = '#2ecc71';
                this.ctx.beginPath();
                this.ctx.arc(
                    (this.maze.end.x + 0.5) * this.cellSize,
                    (this.maze.end.y + 0.5) * this.cellSize,
                    this.cellSize * 0.3, 0, Math.PI * 2
                );
                this.ctx.fill();
            }

            drawLine(x1, y1, x2, y2) {
                this.ctx.beginPath();
                this.ctx.moveTo(x1, y1);
                this.ctx.lineTo(x2, y2);
                this.ctx.stroke();
            }

            initEvent() {
                window.addEventListener('resize', () => this.resize());
                
                let lastTap = 0;
                this.canvas.addEventListener('touchstart', e => {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    const touch = e.touches[0];
                    const pos = {
                        x: touch.clientX - rect.left,
                        y: touch.clientY - rect.top
                    };
                    
                    const now = Date.now();
                    if (now - lastTap < 300) {
                        this.handleDoubleTap(pos);
                        lastTap = 0;
                    } else {
                        lastTap = now;
                        this.selectBlock(pos);
                    }
                });

                this.canvas.addEventListener('mousedown', e => {
                    const rect = this.canvas.getBoundingClientRect();
                    const pos = {
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    };
                    this.selectBlock(pos);
                });

                document.getElementById('rotateBtn').addEventListener('click', () => this.rotateBlock());
                document.getElementById('startBtn').addEventListener('click', () => this.startMovement());
                document.getElementById('gameMode').addEventListener('change', (e) => {
                    this.toggleHardMode(e.target.value === 'hard');
                });
                document.getElementById('generateBtn').addEventListener('click', () => {
                    const size = parseInt(document.getElementById('mazeSize').value);
                    this.maze = new Maze(size, size);
                    this.ballPos = {...this.maze.start};
                    this.path = [];
                    this.currentBlock = null;
                    this.resetTimer();
                    this.updatePath();
                    this.draw();
                });
                document.getElementById('submitScore').addEventListener('click', () => this.submitScore());
            }

            toggleHardMode(isHard) {
                this.isHardMode = isHard;
                document.getElementById('moveLimit').style.display = isHard ? 'inline' : 'none';
                document.getElementById('timePenalty').style.display = isHard ? 'inline' : 'none';
                
                if(isHard) {
                    const size = parseInt(document.getElementById('mazeSize').value);
                    this.moveLimit = size * 3; // 根据迷宫尺寸设置移动次数
                    document.querySelector('#moveLimit span').textContent = this.moveLimit;
                    
                    // 启动动态障碍
                    this.dynamicObstacleInterval = setInterval(() => {
                        this.randomRotateBlocks();
                    }, 15000);
                } else {
                    clearInterval(this.dynamicObstacleInterval);
                    this.timePenalty = 0;
                }
                this.draw();
            }

            randomRotateBlocks() {
                const blocksToRotate = Math.floor(this.maze.rows * 0.3); // 每次旋转30%的区块
                for(let i = 0; i < blocksToRotate; i++) {
                    const x = Math.floor(Math.random() * this.maze.cols);
                    const y = Math.floor(Math.random() * this.maze.rows);
                    this.maze.rotateCell(x, y, 1);
                }
                this.updatePath();
            }

            selectBlock(pos) {
                if(this.isMoving) return;
                const x = Math.floor(pos.x / this.cellSize);
                const y = Math.floor(pos.y / this.cellSize);
                
                if (x >= 0 && x < this.maze.cols && y >=0 && y < this.maze.rows) {
                    this.currentBlock = {x, y};
                    this.draw();
                } else {
                    this.currentBlock = null;
                    this.draw();
                }
            }

            handleDoubleTap(pos) {
                const x = Math.floor(pos.x / this.cellSize);
                const y = Math.floor(pos.y / this.cellSize);
                if (x >=0 && x < this.maze.cols && y >=0 && y < this.maze.rows) {
                    this.rotateBlock();
                }
            }

            rotateBlock() {
                if(this.isHardMode) {
                    if(this.moveLimit <= 0) {
                        alert('移动次数已用尽！');
                        this.gameOver(false);
                        return;
                    }
                    
                    this.moveLimit--;
                    document.querySelector('#moveLimit span').textContent = this.moveLimit;
                    
                    // 增加时间惩罚
                    this.timePenalty += 5;
                    document.querySelector('#timePenalty span').textContent = this.timePenalty;
                    document.getElementById('time').textContent = 
                        parseInt(document.getElementById('time').textContent) + this.timePenalty;
                }


                if (!this.currentBlock) {
                    alert('请先选择要旋转的区块！');
                    return;
                }
                
                const x = this.currentBlock.x;
                const y = this.currentBlock.y;

                this.maze.rotateCell(x, y, 1);
                document.getElementById('moves').textContent = parseInt(document.getElementById('moves').textContent) + 1;
                this.startTimer();

                if(document.getElementById('updateMode').value === 'realtime') {
                    this.updatePath();
                }
                
                this.currentBlock = null;
                this.draw();
            }

            gameOver(success) {
                clearInterval(this.timerInterval);
                this.toggleControls(false); // 改为恢复按钮可用
                
                if(this.isHardMode) {
                    clearInterval(this.dynamicObstacleInterval); // 清除障碍物定时器
                    if(success) {
                        this.showLeaderboardModal();
                    } else {
                        alert(`游戏结束！${success ? '成功' : '失败'}`);
                        this.resetGame();
                    }
                }
            }

            async updatePath() {
                if(this.isVisualizing) return;
                this.isVisualizing = true;
                const startTime = performance.now();
                this.toggleControls(true);  // 新增：禁用控件
                
                try {
                    this.path = await this.maze.findPath((state) => {
                        this.visualElements = [
                            ...state.open.map(p => ({...p, color: '#3498db'})),
                            ...state.closed.map(p => ({...p, color: '#e74c3c'})),
                            {...state.current, color: '#2ecc71'}
                        ];
                        this.lastPathState = state;
                        return new Promise(resolve => requestAnimationFrame(resolve));
                    });
                } finally {
                    const time = performance.now() - startTime;
                    document.getElementById('calcTime').textContent = `${Math.round(time)}ms`;
                    this.isVisualizing = false;
                    this.toggleControls(false);  // 新增：启用控件
                }

                this.draw();
            }

            async startMovement() {
                if(this.isHardMode) {
                    this.moveLimit -= 2;
                    if(this.moveLimit < 0) {
                        this.gameOver(false);
                        return;
                    }
                }
                if (this.isMoving) return;
                this.toggleControls(true);
                
                // 新增：暂停计时器
                if(this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.pauseDuration = Date.now() - this.startTime;
                }

                try {
                    if(document.getElementById('updateMode').value === 'manual') {
                        await this.updatePath();
                    }
                    if (!this.path || this.path.length === 0) {
                        alert('找不到可行路径！');
                        this.toggleControls(false);
                        return;
                    }
                    
                    this.isMoving = true;
                    
                    for (const node of this.path) {
                        const targetX = (node.x + 0.5) * this.cellSize;
                        const targetY = (node.y + 0.5) * this.cellSize;
                        await this.animateBall(targetX, targetY);
                    }
                    
                    this.ballPos = {x: this.maze.end.x, y: this.maze.end.y};
                    this.draw();
                    
                    if(this.ballPos.x === this.maze.end.x && this.ballPos.y === this.maze.end.y) {
                        this.showLeaderboardModal();
                        this.resetTimer();
                    }
                } finally {
                    this.isMoving = false;
                    this.toggleControls(false);
                    
                    // 新增：恢复计时器
                    if(this.startTime) {
                        this.startTime = Date.now() - this.pauseDuration;
                        this.timerInterval = setInterval(() => {
                            const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                            document.getElementById('time').textContent = elapsed;
                        }, 1000);
                    }
                }
            }


            toggleControls(disabled) {
                const controls = ['generateBtn', 'rotateBtn', 'startBtn', 'mazeSize', 'gameMode', 'updateMode'];
                controls.forEach(id => {
                    const control = document.getElementById(id);
                    if (control) {
                        control.disabled = disabled;
                    }
                });
            }

            calculateCurrentScore() {
                const difficulty = this.maze.rows;
                const moves = parseInt(document.getElementById('moves').textContent);
                const time = parseInt(document.getElementById('time').textContent);
                
                // 困难模式使用实际耗时（包含惩罚）
                const realTime = this.isHardMode ? 
                    time - this.timePenalty : // 因为显示的时间已经包含惩罚，需要还原实际用时
                    time;
                
                const hardModeMultiplier = this.isHardMode ? 1.5 : 1;
                const timeScore = Math.max(0, 1000 - realTime * 10);
                return Math.round((difficulty * 1000 / (moves + 1) + timeScore) * hardModeMultiplier);
            }

            showLeaderboardModal() {
                const score = this.calculateCurrentScore();
                document.getElementById('currentScore').textContent = score;
                document.getElementById('playerName').placeholder = `请输入名字`;
                document.getElementById('leaderboardModal').style.display = 'flex';
            }

            hideLeaderboardModal() {
                document.getElementById('leaderboardModal').style.display = 'none';
            }

            submitScore() {
                const name = document.getElementById('playerName').value.trim();
                const className = document.getElementById('playerClass').value;
                if (!name) {
                    alert('请输入你的名字！');
                    return;
                }

                const score = this.calculateCurrentScore(); // 使用统一计算方法
    
                const entry = {
                    name: `${name}${this.isHardMode ? ' [大师]' : '[专家]'}`,
                    className,
                    score: score, // 直接使用计算结果
                    isHardMode: this.isHardMode,
                    time: this.isHardMode ? 
                        parseInt(document.getElementById('time').textContent) - this.timePenalty : // 存储实际用时
                        parseInt(document.getElementById('time').textContent),
                    moves: parseInt(document.getElementById('moves').textContent),
                    difficulty: this.maze.rows,
                    date: new Date().toISOString()
                };

                const leaderboard = JSON.parse(localStorage.getItem('leaderboard') || '[]');
                leaderboard.push(entry);
                localStorage.setItem('leaderboard', JSON.stringify(leaderboard));

                this.updateLeaderboardDisplay();
                this.hideLeaderboardModal();
                this.resetGame();
            }

            updateLeaderboardDisplay() {
                const list = document.getElementById('leaderboardList');
                const entries = JSON.parse(localStorage.getItem('leaderboard') || '[]');
                
                entries.sort((a, b) => {
                    if (a.score === b.score) {
                        return b.isHardMode - a.isHardMode;
                    }
                    return b.score - a.score;
                });

                // 显示全部条目而不截断
                list.innerHTML = entries.map(entry => `
                    <div class="leaderboard-entry" style="${entry.isHardMode ? 'color: #6495ed;' : ''}">
                        <span>${entry.name} (${entry.className})</span>
                        <span>${entry.score}${entry.isHardMode ? ' ★' : ''}</span>
                    </div>
                `).join('');
            }

            resetGame() {
                document.getElementById('moves').textContent = '0';
                this.ballPos = {...this.maze.start};
                this.path = [];
                this.currentBlock = null;
                this.toggleControls(false); // 重置时确保按钮可用
                clearInterval(this.dynamicObstacleInterval); // 清除可能残留的定时器
                this.draw();
            }

            resetTimer() {
                if(this.timerInterval) clearInterval(this.timerInterval);
                this.startTime = null;
                document.getElementById('time').textContent = '0';
            }

            startTimer() {
                if(this.isHardMode && this.startTime === null) {
                    this.startTime = Date.now();
                    this.timerInterval = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                        document.getElementById('time').textContent = elapsed + this.timePenalty;
                        
                        // 时间限制
                        if(elapsed + this.timePenalty > 120) { // 2分钟限制
                            this.gameOver(false);
                        }
                    }, 1000);
                }
                if(this.startTime === null) {
                    this.startTime = Date.now();
                    this.timerInterval = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                        document.getElementById('time').textContent = elapsed;
                    }, 1000);
                }
            }

            animateBall(targetX, targetY) {
                return new Promise(resolve => {
                    const startX = (this.ballPos.x + 0.5) * this.cellSize;
                    const startY = (this.ballPos.y + 0.5) * this.cellSize;
                    const dx = targetX - startX;
                    const dy = targetY - startY;
                    // 修改duration计算公式加快速度（原为*1000）
                    const duration = Math.sqrt(dx*dx + dy*dy) / (this.cellSize * 8) * 600;

                    const startTime = Date.now();
                    const animate = () => {
                        const progress = (Date.now() - startTime) / duration;
                        if (progress >= 1) {
                            this.ballPos.x = Math.round((targetX / this.cellSize) - 0.5);
                            this.ballPos.y = Math.round((targetY / this.cellSize) - 0.5);
                            this.draw();
                            resolve();
                            return;
                        }
                        
                        this.ballPos.x = (startX + dx * progress) / this.cellSize - 0.5;
                        this.ballPos.y = (startY + dy * progress) / this.cellSize - 0.5;
                        this.draw();
                        requestAnimationFrame(animate);
                    };
                    animate();
                });
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.draw();
            }
        }

        window.addEventListener('load', () => new Game());
    </script>
</body>
</html>
